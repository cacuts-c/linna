  const themeCatalog = {"spring":{"name":"春日花园","heading":["把晴天，","骑成一首小诗。"],"copy":["花香装满小车篮，","和玲娜贝儿一起，慢慢收藏好时光。"],"weather":"晴天 · 微风 · 好心情","edition":"春日漫游手记 / 01","number":"SPRING / 001","paper":"#faf8ef","scene":"奶油绿的春日花园，明亮的阳光、白云与花田。"},"sakura":{"name":"樱花来信","heading":["借一阵花香，","去看温柔的风。"],"copy":["粉色的心事，开成一朵花，","和玲娜贝儿一起，把温柔带回家。"],"weather":"花开 · 柔风 · 小欢喜","edition":"花间漫游手记 / 02","number":"BLOSSOM / 002","paper":"#fff8f5","scene":"淡樱粉的天空与灰绿花田，粉白小花点缀路边。"},"sea":{"name":"海盐微风","heading":["把微风，","装进蓝色口袋。"],"copy":["天空清透，风也轻轻，","让玲娜贝儿带你去遇见小晴朗。"],"weather":"晴空 · 轻风 · 很自在","edition":"微风漫游手记 / 03","number":"BREEZE / 003","paper":"#f3faf8","scene":"海盐蓝的通透天空，薄荷绿草地和温暖沙色小路。"},"autumn":{"name":"焦糖秋日","heading":["追一束暖光，","把秋天慢慢藏。"],"copy":["小路染上了蜂蜜的颜色，","和玲娜贝儿一起，骑进暖暖的风。"],"weather":"暖阳 · 秋色 · 慢时光","edition":"秋光漫游手记 / 04","number":"AUTUMN / 004","paper":"#fcf7ee","scene":"燕麦金与橄榄绿的秋日草地，柔和的阳光洒在焦糖色小路。"},"dusk":{"name":"暮光星语","heading":["趁晚风温柔，","去收集小星光。"],"copy":["月牙悄悄挂在天空，","和玲娜贝儿一起，把心愿说给星星。"],"weather":"月牙 · 晚风 · 小心愿","edition":"暮光漫游手记 / 05","number":"TWILIGHT / 005","paper":"#f2f0f6","scene":"柔紫蓝的暮光天空，蓝灰草地、弯月与点点星光。"}};
  const themeKeys = Object.keys(themeCatalog);
  const themeButtons = [...document.querySelectorAll('[data-theme-choice]')];
  const storageKey = 'linabell-theme-v1';
  function applyTheme(key, {save = false, announce = false} = {}) {
    if (!Object.prototype.hasOwnProperty.call(themeCatalog, key)) key = 'spring';
    const theme = themeCatalog[key];
    document.documentElement.dataset.theme = key;
    themeButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === key)));
    $('theme-title-first').textContent = theme.heading[0];
    $('theme-title-second').textContent = theme.heading[1];
    $('theme-copy-first').textContent = theme.copy[0];
    $('theme-copy-second').textContent = theme.copy[1];
    $('theme-weather').textContent = theme.weather;
    $('theme-edition').textContent = theme.edition;
    $('theme-number').textContent = theme.number;
    $('scene-title').textContent = `玲娜贝儿的骑行手记 · ${theme.name}`;
    $('scene-desc').textContent = `戴着淡紫兰花的粉色小狐狸玲娜贝儿，骑自行车穿过花田。${theme.scene}尾巴随风轻摆，双脚交替踩踏，篮子里装着花朵和放大镜，蝴蝶轻轻飞过。`;
    document.querySelector('meta[name="theme-color"]').content = theme.paper;
    if (save) { try { localStorage.setItem(storageKey, key); } catch (_) { /* Private browsing may disable persistence; switching still works. */ } }
    if (announce) status.textContent = `已切换到${theme.name}主题。`;
    if (document.querySelector('[data-skin-choice]:not(:disabled)')) describeScene();
  }
  themeButtons.forEach(button => {
    button.disabled = false;
    button.addEventListener('click', () => applyTheme(button.dataset.themeChoice, {save:true,announce:true}));
  });
  $('theme-next').disabled = false;
  $('theme-next').addEventListener('click', () => {
    const current = themeKeys.indexOf(document.documentElement.dataset.theme);
    applyTheme(themeKeys[(current + 1) % themeKeys.length], {save:true,announce:true});
  });
  window.addEventListener('storage', event => {
    if (event.key === storageKey) applyTheme(event.newValue);
  });
  applyTheme(document.documentElement.dataset.theme);

  const skinCatalog = {"classic":{"name":"经典粉绒","description":"柔粉绒毛 · 蓝色眼眸 · 淡紫兰花"},"peach":{"name":"蜜桃奶霜","description":"蜜桃绒毛 · 湖蓝眼眸 · 奶黄兰花"},"berry":{"name":"莓果花语","description":"莓粉绒毛 · 蓝紫眼眸 · 莓紫兰花"},"moon":{"name":"月光紫绒","description":"柔紫绒毛 · 晴蓝眼眸 · 雾蓝兰花"}};
  const skinKeys = Object.keys(skinCatalog);
  const skinButtons = [...document.querySelectorAll('[data-skin-choice]')];
  const skinStorageKey = 'linabell-skin-v1';
  function describeScene() {
    const theme=themeCatalog[document.documentElement.dataset.theme];
    const skin=skinCatalog[document.documentElement.dataset.skin];
    $('scene-desc').textContent = `玲娜贝儿身着${skin.name}皮肤骑车穿过花田：${skin.description}。${theme.scene}尾巴随风轻摆，双脚交替踩踏，篮子里装着花朵和放大镜，蝴蝶轻轻飞过。`;
  }
  function applySkin(key, {save=false,announce=false}={}) {
    if (!Object.prototype.hasOwnProperty.call(skinCatalog,key)) key='classic';
    document.documentElement.dataset.skin=key;
    skinButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.skinChoice===key)));
    if(save){try{localStorage.setItem(skinStorageKey,key);}catch(_){/* Switching remains available without storage. */}}
    describeScene();
    if(announce)status.textContent=`已换上${skinCatalog[key].name}皮肤。`;
  }
  skinButtons.forEach(button=>{
    button.disabled=false;
    button.addEventListener('click',()=>applySkin(button.dataset.skinChoice,{save:true,announce:true}));
  });
  $('skin-next').disabled=false;
  $('skin-next').addEventListener('click',()=>{
    const current=skinKeys.indexOf(document.documentElement.dataset.skin);
    applySkin(skinKeys[(current+1)%skinKeys.length],{save:true,announce:true});
  });
  window.addEventListener('storage',event=>{
    if(event.key===skinStorageKey||event.key===null)applySkin(event.newValue);
  });
  applySkin(document.documentElement.dataset.skin);


  // Continuous tangents keep joints soft; taper and restrained bends preserve the riding posture.
  function limbShape(a, b, c, ra, rb, rc, knee = false) {
    const unit = (p,q) => { const d=Math.hypot(q.x-p.x,q.y-p.y); return {x:(q.x-p.x)/d,y:(q.y-p.y)/d,d}; };
    const u=unit(a,b),v=unit(b,c),n1={x:-u.y,y:u.x},n2={x:-v.y,y:v.x};
    const nd=Math.hypot(n1.x+n2.x,n1.y+n2.y),nk={x:(n1.x+n2.x)/nd,y:(n1.y+n2.y)/nd};
    const off=(p,n,r)=>({x:p.x+n.x*r,y:p.y+n.y*r});
    const pt=p=>`${f(p.x)} ${f(p.y)}`;
    const a1=off(a,n1,ra),a2=off(a,n1,-ra),b1=off(b,nk,rb),b2=off(b,nk,-rb),c1=off(c,n2,rc),c2=off(c,n2,-rc);
    const turn=u.x*v.y-u.y*v.x,span=Math.min(u.d,v.d);
    const inner=knee?.26:.20,outer=knee?.34:.30;
    const round1=span*(turn>0?inner:outer),round2=span*(turn>0?outer:inner);
    const enter1=off(b1,u,-round1),exit1=off(b1,v,round1);
    const enter2=off(b2,u,-round2),exit2=off(b2,v,round2);
    const end=off(c,v,rc),start=off(a,u,-ra*.62),k=.5522847498;
    return `M${pt(a1)}C${pt(off(a1,u,u.d*.27))} ${pt(off(enter1,u,-u.d*.12))} ${pt(enter1)}Q${pt(b1)} ${pt(exit1)}C${pt(off(exit1,v,v.d*.12))} ${pt(off(c1,v,-v.d*.27))} ${pt(c1)}`+
      `C${pt(off(c1,v,k*rc))} ${pt(off(end,n2,k*rc))} ${pt(end)}C${pt(off(end,n2,-k*rc))} ${pt(off(c2,v,k*rc))} ${pt(c2)}`+
      `C${pt(off(c2,v,-v.d*.27))} ${pt(off(exit2,v,v.d*.12))} ${pt(exit2)}Q${pt(b2)} ${pt(enter2)}C${pt(off(enter2,u,-u.d*.12))} ${pt(off(a2,u,u.d*.27))} ${pt(a2)}`+
      `C${pt(off(a2,u,-k*ra*.62))} ${pt(off(start,n1,-k*ra))} ${pt(start)}C${pt(off(start,n1,k*ra))} ${pt(off(a1,u,-k*ra*.62))} ${pt(a1)}Z`;
  }

  // Fixed bone lengths and opposing pedals keep the hips, knees and paws connected.
  function leg(side, angle, bob) {
    const hip = {x: side === 'front' ? 757 : 746, y: 545 + bob};
    const foot = {x: 792 + Math.cos(angle) * crankRadius, y: 663 + Math.sin(angle) * crankRadius};
    const tilt = 2 + Math.sin(angle - .45) * 7, radians = tilt * Math.PI / 180;
    const ankle = {x:foot.x - 5 * Math.cos(radians) + 19 * Math.sin(radians), y:foot.y - 5 * Math.sin(radians) - 19 * Math.cos(radians)};
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    const distance = Math.hypot(dx, dy), upper = 82, lower = 78;
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const across = Math.sqrt(Math.max(0, upper * upper - along * along));
    const knee = {x: hip.x + along * dx / distance + across * dy / distance, y: hip.y + along * dy / distance - across * dx / distance};
    const near = side === 'front';
    const path = limbShape(hip,knee,ankle,near?26:23,near?20:18,near?14.5:13,true);
    el[`leg-${side}`].setAttribute('d', path);
    el[`leg-${side}-outline`].setAttribute('d', path);
    el[`leg-${side}-texture`].setAttribute('d', path);
    jointDetails(`leg-${side}`,hip,knee,ankle);
    transform(el[`foot-${side}`], `translate(${f(foot.x)} ${f(foot.y)}) rotate(${f(tilt)}) translate(0 -7)`);
    transform(el[`pedal-${side}`], `translate(${f(foot.x)} ${f(foot.y)}) rotate(${f(tilt)})`);
    // Cancel the paw's local transform in its gradient, so ankle and foot share one light field.
    el[`paw-${side}-light`].setAttribute('gradientTransform', `translate(0 7) rotate(${f(-tilt)}) translate(${f(-foot.x)} ${f(-foot.y)})`);
    if (near) el['leg-shine'].setAttribute('d', `M${f(hip.x-6)} ${f(hip.y-5)}Q${f((hip.x+knee.x)/2-6)} ${f((hip.y+knee.y)/2-8)} ${f(knee.x-8)} ${f(knee.y-6)}`);
  }

  // Joint shadows and fur follow the limb bisector, never sliding across the bend.
  function jointDetails(part,a,b,c) {
    const first=Math.atan2(b.y-a.y,b.x-a.x),second=Math.atan2(c.y-b.y,c.x-b.x);
    const bend=Math.atan2(Math.sin(second-first),Math.cos(second-first));
    const angle=(first+bend/2)*180/Math.PI;
    transform(document.getElementById(`${part}-details`),`translate(${f(b.x)} ${f(b.y)}) rotate(${f(angle)}) scale(1 ${bend>0?1:-1})`);
  }

  function arms(bob) {
    const a={x:807,y:453+bob},b={x:843,y:488+bob*.25},c={x:886,y:501};
    const d={x:811,y:447+bob},e={x:865,y:480+bob*.25},g={x:916,y:484};
    const front = limbShape(a,b,c,21,17,12);
    const back = limbShape(d,e,g,16,14,11);
    ['arm-front-shape','arm-front-texture'].forEach(id=>el[id].setAttribute('d',front));
    ['arm-back-shape','arm-back-texture'].forEach(id=>el[id].setAttribute('d',back));
    jointDetails('arm-front',a,b,c);jointDetails('arm-back',d,e,g);
  }

  function draw() {
    const angle = time * cadence * TAU + .4;
    const degrees = angle * 180 / Math.PI;
    const distance = time * cadence * TAU * wheelRadius * gearRatio;
    const bob = Math.sin(angle * 2) * .85;
    transform(el['rear-spokes'], `rotate(${f(degrees * gearRatio)})`);
    transform(el['front-spokes'], `rotate(${f(degrees * gearRatio)})`);
    transform(el.crank, `translate(792 663) rotate(${f(degrees)})`);
    leg('front', angle, bob); leg('back', angle + Math.PI, bob); arms(bob);
    transform(el.body, `translate(0 ${f(bob)}) rotate(2 757 545)`);
    transform(el.head, `translate(4 ${f(bob)}) rotate(${f(1.4+Math.sin(time * 1.4) * .4)} 791 420)`);
    transform(el.tail, `rotate(${f(Math.sin(time * 2.1 - .45) * 2.1)} 738 541)`);
    // The hands stay fixed to the handlebars; only the torso and head subtly rise.
    transform(el.landscape, `translate(${f(-(distance * .07 % 1440))} 0)`);
    transform(el.field, `translate(${f(-(distance * .65 % 1440))} 0)`);
    transform(el.foreground, `translate(${f(-(distance % 1440))} 0)`);
    el['road-marks'].setAttribute('patternTransform', `translate(${f(-(distance % 300))} 0)`);
    transform(el.clouds, `translate(${f(-Math.sin(time / 45) * 70)} 0)`);
    transform(el['sun-rays'], `rotate(${f(Math.sin(time / 12) * 7)})`);
    // Each wing hinges at the thorax. The body remains rigid during the wingbeat.
    const flight = time * .68, wingbeat = time * TAU * 5.2;
    const bx = 1137 + Math.sin(flight) * 50;
    const by = 398 + Math.sin(flight * 2) * 24 + Math.sin(flight * 3) * 4;
    const vx = 34 * Math.cos(flight);
    const vy = 32.64 * Math.cos(flight * 2) + 8.16 * Math.cos(flight * 3);
    const heading = Math.atan2(vy, vx) * 180 / Math.PI + 90;
    // A brief, smoothly entered glide interrupts the wingbeats without freezing flight.
    const glidePhase = time % 6.2;
    const glide = glidePhase > 5.2 ? Math.sin((glidePhase - 5.2) * Math.PI) ** 2 : 0;
    const spread = (.16 + .84 * (.5 + .5 * Math.sin(wingbeat))) * (1-glide) + .88 * glide;
    const pitch = 5 * Math.cos(wingbeat) * (1-glide);
    transform(el.butterfly, `translate(${f(bx)} ${f(by)}) rotate(${f(heading)}) scale(.86)`);
    transform(el['butterfly-left'], `rotate(${f(pitch)}) scale(${f(spread)} 1)`);
    transform(el['butterfly-right'], `rotate(${f(-pitch)}) scale(${f(spread*(.94+.06*Math.sin(flight)))} 1)`);
    const blinkAt = time % 5.8;
    const blink = blinkAt > 5.48 && blinkAt < 5.7 ? 1 - Math.sin((blinkAt - 5.48) / .22 * Math.PI) * .94 : 1;
    transform(el['eye-left'], `translate(0 ${f(347 * (1 - blink))}) scale(1 ${f(blink)})`);
    transform(el['eye-right'], `translate(0 ${f(344 * (1 - blink))}) scale(1 ${f(blink)})`);
  }

  function bellFrame(now) {
    const elapsed = (now - bellTime) / 1000;
    const visible = elapsed >= 0 && elapsed < 1.6;
    el['bell-note'].style.opacity = visible ? String(Math.min(1, (1.6 - elapsed) * 2)) : '0';
    transform(el['bell-note'], `translate(0 ${reduceMotion.matches ? 0 : f(-Math.min(elapsed, 1.6) * 13)})`);
    return visible;
  }

  function tick(now) {
    frameId = 0;
    const dt = previous ? Math.min((now - previous) / 1000, .05) : 0;
    previous = now;
    if (running) { time += dt * speed; draw(); }
    const ringing = bellFrame(now);
    if (!document.hidden && (running || ringing)) frameId = requestAnimationFrame(tick);
  }
  function schedule() {
    if (!frameId && !document.hidden) { previous = 0; frameId = requestAnimationFrame(tick); }
  }
  function updateControl() {
    label.textContent = running ? '歇一小会' : '继续出发';
    play.setAttribute('aria-label', running ? '暂停骑行' : '播放骑行');
    play.setAttribute('aria-pressed', String(!running));
    icon.innerHTML = running ? '<path d="M5 4h3v12H5zm7 0h3v12h-3z"/>' : '<path d="M6 3.5 16 10 6 16.5z"/>';
  }
  function setRunning(value) {
    running = value; updateControl();
    status.textContent = running ? '玲娜贝儿继续骑行。' : '骑行已暂停，歇一小会。';
    schedule();
  }
  play.addEventListener('click', () => setRunning(!running));
  document.querySelectorAll('[data-speed]').forEach(button => {
    button.addEventListener('click', () => {
      speed = Number(button.dataset.speed);
      document.querySelectorAll('[data-speed]').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
      status.textContent = `骑行节奏：${button.textContent}。`;
    });
  });
  $('ring-bell').addEventListener('click', () => {
    bellTime = performance.now(); schedule(); status.textContent = '叮铃！好心情正在路上。';
    // Audio is synthesized locally and starts only after the user's click.
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      if (!audioContext) audioContext = new Audio();
      audioContext.resume().then(() => {
        [0, .13].forEach((delay, index) => {
          const oscillator = audioContext.createOscillator(), volume = audioContext.createGain();
          const start = audioContext.currentTime + delay;
          oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(index ? 2360 : 1900, start);
          volume.gain.setValueAtTime(0, start); volume.gain.linearRampToValueAtTime(.075, start + .006); volume.gain.exponentialRampToValueAtTime(.0001, start + 1.05);
          oscillator.connect(volume); volume.connect(audioContext.destination); oscillator.start(start); oscillator.stop(start + 1.1);
          oscillator.onended = () => { oscillator.disconnect(); volume.disconnect(); };
        });
      }).catch(() => {});
    } catch (_) { /* The visible bell feedback also works when audio is unavailable. */ }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(frameId); frameId = 0; previous = 0; }
    else schedule();
  });
  reduceMotion.addEventListener('change', event => { if (event.matches) setRunning(false); });
  function resizeScene() {
    // On phones, preserve the whole bicycle and rider while bringing them closer.
    el.scene.setAttribute('viewBox', narrowScreen.matches ? '310 -350 960 1230' : '0 0 1440 880');
    if (narrowScreen.matches) {
      el.scene.style.background = 'var(--sky-top)';
      el.scene.setAttribute('preserveAspectRatio', 'xMidYMax slice');
    } else {
      el.scene.style.background = '';
      el.scene.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    }
  }
  narrowScreen.addEventListener('change', resizeScene);
  resizeScene(); draw(); updateControl();
  if (running) schedule();
  else status.textContent = '已根据系统的减少动态效果偏好暂停动画，可按“继续出发”播放。';
})();
</script>
